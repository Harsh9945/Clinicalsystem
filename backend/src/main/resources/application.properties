# 2. Database Connection (Dynamic Railway MySQL variables with local fallback)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:clinic_db}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
