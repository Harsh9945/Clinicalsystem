spring.application.name=Clinova
# 1. Server Port (Dynamic for Railway with local port 8080 fallback)
server.port=${PORT:8080}

# 2. Database Connection (Dynamic MySQL variables with local fallback)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:clinic_db}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=${MYSQL_USE_SSL:true}&enabledTLSProtocols=TLSv1.2,TLSv1.3
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:harsh@945}

# 3. Hibernate (This creates/updates your tables automatically)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
gemini.api.key=${GEMINI_API_KEY}

# 📧 Brevo API Configuration (HTTPS API-based - Works on Railway free tier!)
brevo.api.key=${BREVO_API_KEY:}
brevo.from.email=${BREVO_FROM_EMAIL:hj7338484@gmail.com}

# 4. AI Triage Engine Endpoint (Python FastAPI)
python.api.url=${PYTHON_API_URL:http://127.0.0.1:8000/api/v1/chat}
