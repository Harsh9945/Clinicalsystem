spring.application.name=Clinova
# 1. Server Port (Dynamic for Railway with local port 8080 fallback)
server.port=${PORT:8080}

# 2. Database Connection (Dynamic Railway MySQL variables with local fallback)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:clinic_db}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:harsh@945}

# 3. Hibernate (This creates/updates your tables automatically)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
gemini.api.key=${GEMINI_API_KEY}

